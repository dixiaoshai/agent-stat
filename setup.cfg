[metadata]
name = agent-stats
version = 0.1.0
description = Local-first Codex usage analysis with honest coverage

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include = agent_stats*

[options.package_data]
agent_stats = static/*, static/assets/*

[options.entry_points]
console_scripts =
    agent-stats = agent_stats.cli:main
    agent-stat = agent_stats.cli:main

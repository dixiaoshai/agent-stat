name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  sensitive:
    name: Sensitive data scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: python3 scripts/check_sensitive.py

  # Single required check for branch protection; keeps matrix job names out of the rule.
  ci-success:
    name: CI success
    if: always()
    needs: [python, frontend, sensitive]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all jobs passed
        run: |
          if [ "${{ needs.python.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.sensitive.result }}" != "success" ]; then
            echo "python=${{ needs.python.result }} frontend=${{ needs.frontend.result }} sensitive=${{ needs.sensitive.result }}"
            exit 1
          fi
